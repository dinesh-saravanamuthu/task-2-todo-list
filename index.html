<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean vanilla JavaScript To-Do List web app.">
  <title>TaskFlow — To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-label="To-Do List application">
      <header class="app-header">
        <div>
          <p class="eyebrow">TASK 02 · WEB DEVELOPMENT INTERNSHIP</p>
          <h1>Task<span>Flow</span></h1>
          <p class="subtitle">Organize your day, one task at a time.</p>
        </div>
        <div class="date-badge" id="currentDate" aria-label="Today's date"></div>
      </header>

      <section class="input-area" aria-label="Add a new task">
        <label class="sr-only" for="taskInput">Task name</label>
        <input id="taskInput" type="text" maxlength="120"
               placeholder="What needs to be done?"
               autocomplete="off">
        <button id="addTaskBtn" type="button">Add Task</button>
      </section>

      <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>

      <section class="toolbar" aria-label="Task filters">
        <div class="task-count"><strong id="taskCount">0</strong> tasks remaining</div>
        <div class="filters">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">Active</button>
          <button class="filter" data-filter="completed" type="button">Completed</button>
        </div>
      </section>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✓</div>
        <h2 id="emptyTitle">No tasks yet</h2>
        <p id="emptyText">Add your first task above and get started.</p>
      </div>

      <footer class="app-footer">
        <button id="clearCompleted" type="button" class="clear-btn">Clear completed</button>
        <span>Vanilla JavaScript · DOM &amp; Events</span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
